# Quick test: 0.6B, IAB only, line + page_prototype, smaller retain
seed: 42
output_dir: "benchmarks/results/pipeline_qa/pilot_06b_quick"

model:
  base_path: "benchmarks/models/Qwen3-0.6B"
  name: "qwen3-0.6b"
  max_seq_length: 256
  enable_thinking: false
  compute_dtype: "bfloat16"

data:
  ob_data_dir: "benchmarks/results/pipeline_qa/qa_chatml"
  data_file: "benchmarks/results/pipeline_qa/qa_chatml/jsonl/data.jsonl"
  forget_sets_file: "benchmarks/scripts/pipeline_qa/results/forget_sets.json"
  retain_size: 5000
  forget_max_size: 2000

authors:
  - name: "InternetArchiveBot"

forget_set_types:
  - line
  - page_prototype

sft:
  num_train_epochs: 1
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-5
  warmup_ratio: 0.03
  weight_decay: 0.01
  lr_scheduler_type: "cosine"
  bf16: true
  logging_steps: 50
  save_steps: 500

npo:
  num_train_epochs: 3
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 1.0e-5
  beta: 0.1
  warmup_ratio: 0.1
  weight_decay: 0.01
  lr_scheduler_type: "cosine"
  max_grad_norm: 1.0
  retain_weight: 1.0

eval:
  eval_sample_size: 50
